  <script>
    (function() {
      const widget = document.getElementById('edubot-home-widget');
      const fab = document.getElementById('edubot-home-fab');
      const messagesEl = document.getElementById('edubot-home-messages');
      const form = document.getElementById('edubot-home-form');
      const input = document.getElementById('edubot-home-input');
      const micBtn = document.getElementById('edubot-home-mic-btn');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;
      let recognition = null;
      let listening = false;
      let lastBotReply = "";
      let currentTtsText = "";
      let recognitionSource = null; // 'widget' ou 'voice'

      const voicePanel = document.getElementById('eduvoice-panel');
      const voiceFab = document.getElementById('eduvoice-fab');
      const voiceStatus = document.getElementById('eduvoice-status');
      const voiceMicBtn = document.getElementById('eduvoice-mic-btn');
      const voiceMicLabel = document.getElementById('eduvoice-mic-label');
      const voiceStopBtn = document.getElementById('eduvoice-stop-tts-btn');

      window.toggleEduBotWidget = function() {
        if (!widget || !fab) return;
        const isOpen = widget.classList.contains('open');
        if (isOpen) {
          widget.classList.remove('open');
        } else {
          // Fermer EduVoice si ouvert
          if (voicePanel && voicePanel.classList.contains('open')) {
            voicePanel.classList.remove('open');
            if (recognition && listening) recognition.stop();
          }
          // Fermer le widget Messaging s'il est ouvert
          try {
            const messaging = document.getElementById('messagingWidget');
            if (messaging && !messaging.classList.contains('minimized')) {
              messaging.classList.add('minimized');
            }
          } catch (err) {
            console.error("Erreur lors de la fermeture de Messaging depuis EduBot :", err);
          }
          widget.classList.add('open');
        }
      };

      window.toggleEduVoicePanel = function() {
        if (!voicePanel || !voiceFab) return;
        const isOpen = voicePanel.classList.contains('open');
        if (isOpen) {
          voicePanel.classList.remove('open');
          if (recognition && listening) recognition.stop();
        } else {
          // Fermer EduBot si ouvert
          if (widget && widget.classList.contains('open')) {
            widget.classList.remove('open');
          }
          // Fermer le widget Messaging s'il est ouvert
          try {
            const messaging = document.getElementById('messagingWidget');
            if (messaging && !messaging.classList.contains('minimized')) {
              messaging.classList.add('minimized');
            }
          } catch (e) {
            console.error("Erreur lors de la fermeture de Messaging depuis EduVoice :", e);
          }
          voicePanel.classList.add('open');
        }
      };

      // Fonction pour envoyer une suggestion
      window.sendHomeSuggestion = function(text) {
        if (input) {
          input.value = text;
          input.focus();
          // Déclencher l'envoi automatiquement
          if (form) {
            const event = new Event('submit', { bubbles: true, cancelable: true });
            form.dispatchEvent(event);
          }
        }
      };

      window.sendEduBotHomeMessage = async function(e) {
        if (e) e.preventDefault();
        const text = (input.value || "").trim();
        if (!text) return;

        const userDiv = document.createElement('div');
        userDiv.className = 'edubot-home-message edubot-home-message-user';
        userDiv.innerHTML = '<div class="edubot-home-message-author">Vous</div>' +
                            '<div class="edubot-home-message-text"></div>';
        userDiv.querySelector('.edubot-home-message-text').textContent = text;
        messagesEl.appendChild(userDiv);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        input.value = "";

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'edubot-home-message edubot-home-message-bot';
        loadingDiv.innerHTML = '<div class="edubot-home-message-author">EduBot</div>' +
                               '<div class="edubot-home-message-text">...</div>';
        messagesEl.appendChild(loadingDiv);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        try {
          const resp = await fetch("{% url 'edubot_public_chat' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });
          let data = null;
          try {
            data = await resp.json();
          } catch (parseErr) {
            throw new Error("Réponse invalide du serveur.");
          }
          const replyText = data.reply || data.error || "Erreur lors de la réponse d’EduBot.";
          lastBotReply = data.reply || "";
          loadingDiv.querySelector('.edubot-home-message-text').textContent = replyText;
          attachTTSButton(loadingDiv, replyText);

          // Gérer la redirection si présente
          if (data.redirect) {
            setTimeout(() => {
              window.location.href = data.redirect;
            }, 3000); // Laisser 3 secondes pour lire la réponse
          }
        } catch (err) {
          loadingDiv.querySelector('.edubot-home-message-text').textContent = "Erreur de connexion à EduBot.";
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };

      // Appel dédié pour EduVoice (assistant vocal), sans afficher le texte du bot dans le chat
      async function sendEduVoiceQuery(spokenText) {
        if (!spokenText) return;
        if (voiceStatus) voiceStatus.textContent = "EduVoice réfléchit...";
        try {
          const resp = await fetch("{% url 'edubot_public_chat' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: spokenText })
          });
          let data = null;
          try {
            data = await resp.json();
          } catch (parseErr) {
            throw new Error("Réponse invalide du serveur.");
          }
          const replyText = data.reply || data.error || "Je n'arrive pas à répondre pour le moment.";
          if (voiceStatus) voiceStatus.textContent = "EduVoice : réponse lue à voix haute.";
          speak(replyText);

          // Gérer la redirection si présente
          if (data.redirect) {
            setTimeout(() => {
              window.location.href = data.redirect;
            }, 4000); // Un peu plus long pour le vocal
          }
        } catch (err) {
          if (voiceStatus) voiceStatus.textContent = "Erreur de connexion à EduBot pour EduVoice.";
        }
      }

      function speak(text) {
        if (!synth || !text) return;
        // Si on clique à nouveau sur le même texte pendant la lecture, on stoppe
        if (synth.speaking && currentTtsText === text) {
          synth.cancel();
          currentTtsText = "";
          return;
        }
        synth.cancel();
        currentTtsText = text;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'fr-FR';
        synth.speak(utter);
      }
      if (voiceStopBtn) {
        voiceStopBtn.addEventListener('click', function() {
          if (synth) {
            synth.cancel();
            currentTtsText = "";
            if (voiceStatus) voiceStatus.textContent = "Lecture arrêtée.";
          }
        });
      }

      function attachTTSButton(container, explicitText) {
        if (!container) return;
        const existing = container.querySelector('.edubot-home-tts-inline');
        if (existing) return;
        const textDiv = container.querySelector('.edubot-home-message-text');
        if (!textDiv) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'edubot-home-tts-inline';
        btn.innerHTML = '<i class="bi bi-soundwave"></i><span>Écouter</span>';
        btn.addEventListener('click', function() {
          const t = explicitText || textDiv.textContent;
          speak(t);
        });
        container.appendChild(btn);
      }

      function initRecognition() {
        if (!SpeechRecognition) {
          if (micBtn) micBtn.style.display = 'none';
          if (voiceMicBtn) voiceMicBtn.style.display = 'none';
          return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          listening = true;
          if (micBtn) micBtn.classList.add('active');
          if (voiceMicBtn) voiceMicBtn.classList.add('active');
          if (voiceMicLabel) voiceMicLabel.textContent = "Parler... (cliquer pour arrêter)";
          if (voiceStatus) voiceStatus.textContent = "Écoute en cours...";
        };
        recognition.onend = () => {
          listening = false;
          recognitionSource = null;
          if (micBtn) micBtn.classList.remove('active');
          if (voiceMicBtn) voiceMicBtn.classList.remove('active');
          if (voiceMicLabel) voiceMicLabel.textContent = "Appuyer pour parler";
          if (voiceStatus) voiceStatus.textContent = "Micro inactif.";
        };
        recognition.onerror = () => {
          listening = false;
          recognitionSource = null;
          if (micBtn) micBtn.classList.remove('active');
          if (voiceMicBtn) voiceMicBtn.classList.remove('active');
          if (voiceStatus) voiceStatus.textContent = "Erreur de micro ou permissions.";
        };
        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript;
          if (recognitionSource === 'widget') {
            // Remplir le champ du chatbot flottant
            input.value = (input.value ? input.value + " " : "") + text;
            input.focus();
          } else if (recognitionSource === 'voice') {
            // EduVoice : pas d'écriture dans le chat, simple statut + appel API + TTS
            if (voiceStatus) {
              voiceStatus.textContent = "Tu as dit : " + text + " (analyse en cours...)";
            }
            // Envoyer au backend pour obtenir une réponse vocale
            sendEduVoiceQuery(text);
          }
        };

        if (micBtn) {
          micBtn.addEventListener('click', function() {
            if (!recognition) return;
            if (!listening) {
              recognitionSource = 'widget';
              recognition.start();
            } else {
              recognition.stop();
            }
          });
        }
        if (voiceMicBtn) {
          voiceMicBtn.addEventListener('click', function() {
            if (!recognition) return;
            if (!listening) {
              recognitionSource = 'voice';
              recognition.start();
            } else {
              recognition.stop();
            }
          });
        }
      }

      // Ajouter un bouton TTS sur le premier message d'EduBot
      if (messagesEl) {
        const initialBot = messagesEl.querySelector('.edubot-home-message-bot');
        if (initialBot) {
          attachTTSButton(initialBot, initialBot.querySelector('.edubot-home-message-text')?.textContent || '');
        }
      }

      initRecognition();
    })();
  </script>
