{% extends 'evently/base.html' %}
{% block title %}Contact • EduLife{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <h2>Contact</h2>
    <form class="php-email-form" action="#" method="post">
      <div class="row gy-3">
        <div class="col-md-6"><input type="text" class="form-control" placeholder="Your Name"></div>
        <div class="col-md-6"><input type="email" class="form-control" placeholder="Your Email"></div>
        <div class="col-12"><input type="text" class="form-control" placeholder="Subject"></div>
        <div class="col-12"><textarea class="form-control" rows="6" placeholder="Message"></textarea></div>
        <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Send</button></div>
      </div>
    </form>
  </div>
</section>
{% endblock %}
