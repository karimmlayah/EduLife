{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Google - GL Project</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            width: 100%;
            transition: all 0.3s;
        }
        .google-btn:hover {
            background: #357ae8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .status.error {
            background: #fee;
            color: #c33;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Connexion avec Google</h2>
        <p>Cliquez sur le bouton ci-dessous pour vous connecter avec votre compte Google</p>
        
        <button class="google-btn" id="googleSignInBtn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <g fill="#000" fill-rule="evenodd">
                    <path d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z" fill="#EA4335"/>
                    <path d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.21 1.18-.84 2.18-1.79 2.91l2.75 2.13c1.63-1.5 2.72-3.7 2.72-6.54z" fill="#4285F4"/>
                    <path d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z" fill="#FBBC05"/>
                    <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.75-2.13c-.76.53-1.78.9-3.21.9-2.38 0-4.4-1.57-5.12-3.74L.96 13.04C2.45 15.98 5.48 18 9 18z" fill="#34A853"/>
                </g>
            </svg>
            Se connecter avec Google
        </button>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        // Fonction helper pour obtenir le cookie CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.getElementById('googleSignInBtn').addEventListener('click', function() {
            // Simuler l'authentification Google
            // En production, utilisez l'API Google OAuth 2.0
            // Pour l'instant, on demande l'email manuellement
            
            const email = prompt('Entrez votre email Google:');
            if (!email) {
                return;
            }
            
            // Simuler les données Google (en production, obtenez-les depuis l'API Google)
            const userData = {
                email: email,
                name: email.split('@')[0],
                picture: '',
                google_id: 'google_' + Date.now()
            };
            
            // Envoyer au serveur
            const csrftoken = getCookie('csrftoken');
            fetch('/api/google-auth/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Envoyer un message à la fenêtre parent
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'GOOGLE_AUTH_SUCCESS',
                            redirect: data.redirect
                        }, window.location.origin);
                    }
                    // Fermer la popup après un court délai
                    setTimeout(() => {
                        window.close();
                    }, 500);
                } else {
                    document.getElementById('status').textContent = data.error || 'Erreur lors de la connexion';
                    document.getElementById('status').className = 'status error';
                    
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'GOOGLE_AUTH_ERROR',
                            error: data.error || 'Erreur lors de la connexion'
                        }, window.location.origin);
                    }
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('status').textContent = 'Erreur lors de la connexion Google';
                document.getElementById('status').className = 'status error';
                
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'GOOGLE_AUTH_ERROR',
                        error: 'Erreur lors de la connexion Google'
                    }, window.location.origin);
                }
            });
        });
    </script>
</body>
</html>
